<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>สมุดตามคำบอก</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&family=Anuphan:wght@400;500;600&display=swap">
<style>
/* Layout: a school exercise book — ruled lines, red margin, teacher's red-pen marks. Stages sit in a swipeable card carousel. */
:root{
  --paper:#FCFDFB; --paper-2:#F1F5F8; --ink:#22305A; --ink-soft:#5B6788;
  --rule:#C9DCEB; --margin:#E2574C; --pencil:#F2B829; --mint:#3FA98A;
  --card:#FFFFFF; --margin-soft:rgba(226,87,76,.5); --shadow:0 1px 0 rgba(34,48,90,.08),0 6px 18px -10px rgba(34,48,90,.25);
  --f-display:"Mali","Anuphan",system-ui,sans-serif;
  --f-body:"Anuphan",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1C2826; --paper-2:#22312E; --ink:#ECEFE4; --ink-soft:#A9B7AF;
  --rule:#30473F; --margin:#FF877C; --pencil:#F6CF5C; --mint:#69D1B0;
  --card:#25342F; --margin-soft:rgba(255,135,124,.5); --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 20px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1C2826; --paper-2:#22312E; --ink:#ECEFE4; --ink-soft:#A9B7AF;
  --rule:#30473F; --margin:#FF877C; --pencil:#F6CF5C; --mint:#69D1B0;
  --card:#25342F; --margin-soft:rgba(255,135,124,.5); --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 20px -12px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:760px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--pencil);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.3;margin:0}

/* header */
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:20px 12px;border-bottom:2px solid var(--rule)}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:1.6rem}
.brand small{display:block;font-family:var(--f-body);font-size:.8rem;color:var(--ink-soft);font-weight:500;letter-spacing:.02em}
.menu{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.burger{display:none;width:44px;height:44px;border-radius:12px;border:2px solid var(--rule);background:var(--card);color:var(--ink);place-items:center;padding:0;-webkit-tap-highlight-color:transparent}
.burger svg{width:22px;height:22px;display:block}
.burger .ic-close{display:none}
header.open .burger .ic-open{display:none}
header.open .burger .ic-close{display:block}
.burger:focus{outline:none}
.burger:focus-visible{border-color:var(--ink)}
.lang.menu-lang{display:none}
.themebtn{width:40px;height:40px;border-radius:50%;border:2px solid var(--rule);background:var(--card);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0;font-weight:600}
.themebtn svg{width:20px;height:20px;flex:none}
.themebtn .tl{display:none}
@media (max-width:600px){
  .burger{display:grid}
  .menu{display:none;width:100%;flex-direction:column;align-items:stretch;gap:12px;padding-block:6px 4px}
  header.open .menu{display:flex}
  .menu .chip{align-self:flex-start}
  .menu nav{flex-direction:column;border-radius:14px}
  .menu nav button{text-align:left;padding:10px 14px;border-radius:10px}
  .lang.menu-lang{display:inline-flex;align-self:flex-start}
  .themebtn{width:auto;height:auto;border-radius:12px;padding:8px 14px;align-self:flex-start}
  .themebtn .tl{display:inline}
  .home-lang .lang{display:none}
}
nav{display:flex;gap:4px;background:var(--paper-2);padding:4px;border-radius:999px}
nav button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-weight:600;font-size:.95rem;color:var(--ink-soft)}
nav button[aria-current="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.chip{border:2px solid var(--rule);background:var(--card);border-radius:999px;padding:0 12px 0 6px;display:inline-flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:600;max-width:14em}
.chip .av{width:26px;height:26px;border-radius:50%;background:var(--pencil);color:#22305A;display:grid;place-items:center;font-size:.85rem;flex:none}
.chip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:2.2}

main{padding-block:20px}
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);font-weight:600}
.muted{color:var(--ink-soft)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.spacer{flex:1}
.notice{font-size:.85rem;padding:10px 14px;border-radius:10px;background:var(--paper-2);border-left:4px solid var(--pencil);margin-bottom:14px}

/* name page: the cover label of the exercise book */
.cover{max-width:460px;margin:24px auto 0;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:28px 24px;display:grid;gap:16px;text-align:center}
.cover .label{border:2px solid var(--ink);border-radius:12px;padding:16px 18px 12px;display:grid;gap:4px;text-align:left}
.cover .label span{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);font-weight:600}
/* px line-height: Mali stacks Thai tone marks ~1.5em above the baseline and inputs clip anything taller */
.cover input{font-family:var(--f-display);font-size:1.6rem;line-height:64px;height:64px;border:0;border-bottom:2px dashed var(--rule);background:transparent;color:var(--ink);padding:0 2px;width:100%}
.cover input:focus{outline:none;border-bottom-color:var(--pencil)}
.cover .row{justify-content:center}
.players{display:grid;gap:6px;justify-items:center}
.pchip{border:2px solid var(--rule);background:var(--paper-2);border-radius:99px;padding:0 14px;font-family:var(--f-display);font-weight:600;line-height:2.2}
.pchip:hover{border-color:var(--ink)}
.cover .err{color:var(--margin);font-size:.85rem;min-height:1.3em}

/* language switch */
.lang{display:inline-flex;border:2px solid var(--ink);border-radius:12px;overflow:hidden}
.lang button{border:0;background:transparent;padding:6px 16px;font-family:var(--f-display);font-weight:700}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* points + next badge strip */
.purse{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 16px;margin-top:16px}
.purse img,.purse svg{width:64px;height:64px;object-fit:contain}
.purse .big{font-family:var(--f-display);font-weight:700;font-size:1.5rem;font-variant-numeric:tabular-nums;line-height:1.4}
.bar{height:10px;border-radius:99px;background:var(--paper-2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--pencil);border-radius:99px}

/* stage ring: portrait cards on a slowly turning 3D cylinder; cards off to the side blur and fade */
.ring-wrap{--cw:min(200px,50vw);--ch:calc(var(--cw) * 1.55);position:relative;margin-top:6px;height:calc(var(--ch) + 56px);perspective:900px;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;
  -webkit-mask-image:linear-gradient(to right,transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(to right,transparent,#000 14%,#000 86%,transparent)}
.ring{position:absolute;left:50%;top:24px;width:var(--cw);height:var(--ch);margin-left:calc(var(--cw) / -2);transform-style:preserve-3d;transition:transform 1s cubic-bezier(.45,.05,.25,1)}
.ring.dragging,.ring.instant{transition:none}
.card3d{position:absolute;inset:0;transform-style:preserve-3d;cursor:pointer}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;transition:filter .8s,opacity .8s}
.card3d.side .face{filter:blur(1.5px) saturate(.7) brightness(1.06)}
.card3d.far .face{filter:blur(3px);opacity:.25}
/* card art: fixed colours, it is a printed object and reads the same in both themes */
.scard{background:var(--c);color:#22305A;overflow:hidden;box-shadow:0 2px 0 rgba(0,0,0,.06),0 18px 30px -16px rgba(34,48,90,.5);
  background-image:linear-gradient(to right,transparent 22px,rgba(226,87,76,.55) 22px 24px,transparent 24px),repeating-linear-gradient(transparent 0 25px,rgba(34,48,90,.13) 25px 26px);background-position:0 0,0 46%}
.scard .tag{position:absolute;left:32px;top:14px;font-family:var(--f-body);font-weight:700;font-size:.72rem;letter-spacing:.12em;background:#22305A;color:#fff;padding:0 8px;border-radius:6px;line-height:1.8}
.scard .lv{position:absolute;right:14px;top:4px;font-family:var(--f-display);font-weight:700;font-size:calc(var(--cw) * .42);line-height:1.15;color:#22305A}
.scard .ttl{position:absolute;left:32px;right:12px;bottom:46px;font-family:var(--f-display);font-weight:700;font-size:calc(var(--cw) * .1);line-height:1.5;text-wrap:balance}
.scard .word{position:absolute;left:30px;top:44%;font-family:var(--f-display);font-weight:600;font-size:calc(var(--cw) * .085);line-height:2;color:#E2574C;transform:rotate(-5deg);background:rgba(255,255,255,.7);padding:0 8px;border-radius:6px;max-width:calc(100% - 44px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scard .dots6{position:absolute;left:32px;bottom:18px;display:flex;gap:4px}
.scard .dots6 i{width:8px;height:8px;border-radius:50%;background:rgba(34,48,90,.22)}
.scard .dots6 i.on{background:#22305A}
.scard.locked{filter:grayscale(1)}
.card3d.side .scard.locked{filter:grayscale(1) blur(1.5px) brightness(1.06)}
.card3d.far .scard.locked{filter:grayscale(1) blur(3px)}
.scard .lockpill{position:absolute;right:12px;bottom:14px;font-family:var(--f-body);font-weight:700;font-size:.72rem;background:#22305A;color:#fff;padding:0 9px;border-radius:99px;line-height:1.9;display:inline-flex;align-items:center;gap:4px}
/* padlock */
.lockic{width:1em;height:1em;flex:none;vertical-align:-.14em}
.scard .biglock{position:absolute;left:50%;top:50%;width:calc(var(--cw) * .32);height:calc(var(--cw) * .32);margin:calc(var(--cw) * -.16) 0 0 calc(var(--cw) * -.16);border-radius:50%;background:#22305A;color:#fff;display:grid;place-items:center;box-shadow:0 6px 14px -6px rgba(0,0,0,.5)}
.scard .biglock .lockic{width:46%;height:46%}
.face.back .lockic{width:28px;height:28px;margin-top:4px}
.lockline{display:inline-flex;align-items:center;gap:6px}
.bwrap{position:relative;display:inline-grid;place-items:center}
.bwrap .padlock{position:absolute;width:38%;height:38%;max-width:44px;max-height:44px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;box-shadow:var(--shadow)}
.bwrap .padlock .lockic{width:50%;height:50%}
.face.back{transform:rotateY(180deg);background-color:#22305A;color:#FCFDFB;display:grid;place-content:center;justify-items:center;
  background-image:linear-gradient(to right,transparent 22px,#E2574C 22px 24px,transparent 24px)}
.face.back .bnum{font-family:var(--f-display);font-weight:700;font-size:3.5rem;line-height:1.2}
.face.back .blabel{font-family:var(--f-display);font-weight:600;letter-spacing:.06em;line-height:2}
/* text under the ring follows the front card */
.stage-info{text-align:center;display:grid;justify-items:center;gap:6px;min-height:170px}
.stage-info h2{font-size:1.5rem}
.stage-info .sub{color:var(--ink-soft);font-size:.92rem}
.stage-info .bar{width:min(260px,80%)}
.stage-info .start{width:min(260px,80%)}
.fade-in{animation:fadein .5s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}}
.lockline{font-size:.85rem;font-weight:600;color:var(--ink-soft)}
.stars{letter-spacing:2px;color:var(--pencil);font-size:1.05rem}
.stars .off{color:var(--rule)}
.diff{display:flex;gap:3px}
.diff i{width:7px;height:14px;border-radius:2px;background:var(--rule)}
.diff i.on{background:var(--ink)}
.start{width:100%;justify-content:center;font-size:1.1rem;padding:12px 16px;font-family:var(--f-display)}
.arrow{width:42px;height:42px;border-radius:50%;border:2px solid var(--ink);background:var(--card);display:grid;place-items:center;font-size:1.2rem;font-weight:700;z-index:2}
.ring-ctl{display:flex;justify-content:center;align-items:center;gap:16px}
.dots{display:flex;justify-content:center;gap:8px}
.dots button{width:10px;height:10px;border-radius:50%;border:0;padding:0;background:var(--rule)}
.dots button[aria-current="true"]{background:var(--ink);width:24px;border-radius:99px}

/* notebook page */
.page{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);position:relative;overflow:hidden}
.page-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center;padding:14px 18px;border-bottom:2px solid var(--rule)}
.lines{position:relative;padding:0 14px 0 64px;
  background-image:linear-gradient(var(--rule) 1px,transparent 1px);background-size:100% 60px;background-position:0 59px}
.lines::before{content:"";position:absolute;left:52px;top:0;bottom:0;border-left:2px solid var(--margin);opacity:.7}
.line{min-height:60px;display:flex;align-items:center;gap:10px;position:relative}
.line .n{position:absolute;left:-52px;width:40px;text-align:center;font-family:var(--f-display);color:var(--ink-soft);font-size:.95rem}
.line.cur .n{color:var(--margin);font-weight:700}
.line .written{font-family:var(--f-display);font-size:1.35rem;line-height:2.2;flex:1;min-width:0;overflow-wrap:anywhere}
.line .blank{color:var(--ink-soft);opacity:.5}
.mark{font-family:var(--f-display);font-weight:700;color:var(--margin);font-size:1.3rem;white-space:nowrap}
.fix{font-family:var(--f-display);color:var(--margin);font-size:1.1rem;line-height:2.2;overflow-wrap:anywhere;min-width:0}
.strike{text-decoration:line-through;text-decoration-color:var(--margin);text-decoration-thickness:2px}
#answer{font-family:var(--f-display);font-size:1.45rem;line-height:58px;border:0;background:transparent;color:var(--ink);width:100%;height:58px;padding:0}
#answer:focus{outline:none}
#answer::placeholder{color:var(--ink-soft);opacity:.5}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 18px;border-top:2px solid var(--rule);background:var(--paper-2)}
.btn{border:2px solid var(--ink);background:var(--card);border-radius:12px;padding:8px 16px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.speak{width:64px;height:64px;border-radius:50%;border:0;background:var(--pencil);color:#22305A;display:grid;place-items:center;box-shadow:var(--shadow)}
.speak svg{width:30px;height:30px}
.speak.playing{animation:pulse .9s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.peek{font-family:var(--f-display);font-size:1.4rem;line-height:2;padding:0 12px;border-radius:10px;background:var(--paper-2)}

/* voice settings */
.voicecfg{border-bottom:2px solid var(--rule);background:var(--paper-2)}
.voicecfg summary{cursor:pointer;padding:8px 18px;font-size:.88rem;font-weight:600;color:var(--ink-soft);line-height:1.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.voicecfg .vbody{display:grid;gap:8px;padding:4px 18px 14px;max-width:440px}
.voicecfg label{font-size:.85rem;font-weight:600}
.voicecfg select{font:inherit;font-size:.9rem;padding:6px 8px;border-radius:10px;border:2px solid var(--rule);background:var(--card);color:var(--ink);max-width:100%}
.voicecfg input[type=range]{width:100%;accent-color:var(--ink)}
.voicecfg .btn{justify-self:start}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;width:min(440px,calc(100% - 32px));
  background:var(--ink);color:var(--paper);border-radius:14px;padding:12px 14px;display:grid;gap:6px;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);font-size:.9rem}
.toast b{font-family:var(--f-display);font-size:1rem;line-height:1.7}
.toast .btn{justify-self:end;background:transparent;color:var(--paper);border-color:var(--paper);padding:4px 12px}

/* results */
.result{text-align:center;padding:24px 18px 8px;display:grid;gap:12px;justify-items:center}
.circled{font-family:var(--f-display);font-weight:700;color:var(--margin);font-size:2.4rem;border:3px solid var(--margin);border-radius:50%;padding:10px 22px;transform:rotate(-6deg);font-variant-numeric:tabular-nums}
.gain{font-family:var(--f-display);font-weight:700;font-size:1.2rem;color:var(--mint)}
.unlocks{display:flex;flex-wrap:wrap;justify-content:center;gap:16px}
.unlocks figure{margin:0;display:grid;justify-items:center;gap:4px;font-family:var(--f-display);font-weight:600}
.badge-reveal{animation:pop .7s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(.3) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
.newstage{font-family:var(--f-display);font-weight:700;background:var(--pencil);color:#22305A;padding:2px 14px;border-radius:99px;line-height:2}

/* badges */
.bimg{object-fit:contain;display:block}
.bimg.locked{filter:grayscale(1);opacity:.35}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(220px,40%),1fr));gap:14px;margin-top:14px}
.bcard{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 10px;display:grid;justify-items:center;gap:4px;text-align:center}
.bcard .bn{font-family:var(--f-display);font-weight:600;font-size:1rem;line-height:1.6}
.bcard .bl{font-size:.8rem;color:var(--ink-soft)}
.bcard.locked .bn{color:var(--ink-soft)}

/* answer rows (results + history) */
.answers{border-top:2px solid var(--rule)}
.ans{display:grid;grid-template-columns:40px minmax(0,1fr) auto;column-gap:10px;padding:6px 16px 10px 0;border-bottom:1px solid var(--rule);position:relative}
.ans::before{content:"";position:absolute;left:48px;top:0;bottom:0;border-left:2px solid var(--margin-soft)}
.ans .n{text-align:center;font-family:var(--f-display);color:var(--ink-soft);line-height:2.6}
.ans .main{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 12px;padding-left:8px;min-width:0}
.ans .written{font-family:var(--f-display);font-size:1.3rem;line-height:2.2;overflow-wrap:anywhere}
.ans .blank{color:var(--ink-soft);opacity:.5}
.ans .mark{line-height:2.2}
.ans .meaning{grid-column:2 / 4;padding-left:8px;font-size:.88rem;color:var(--ink-soft);line-height:1.7}
/* ranking + live */
.room-in{font-family:var(--f-display);font-size:1.2rem;line-height:52px;height:52px;border:0;border-bottom:2px dashed var(--rule);background:transparent;color:var(--ink);width:100%;letter-spacing:.08em}
.room-in:focus{outline:none;border-bottom-color:var(--pencil)}
.rank{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}
.rank li{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:8px 14px}
.rank li.me{outline:2px solid var(--pencil)}
.rank .pos{font-family:var(--f-display);font-weight:700;font-size:1.2rem;text-align:center;color:var(--ink-soft)}
.rank .person{display:grid;min-width:0}
.rank .nick{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.9}
.rank .sub{font-size:.78rem;color:var(--ink-soft)}
.rank .pts{font-family:var(--f-display);font-weight:700;font-size:1.15rem;font-variant-numeric:tabular-nums}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:end;max-width:460px;margin:8px auto 0;padding-top:8px}
.pod{display:grid;justify-items:center;gap:2px;text-align:center;min-width:0;animation:rise .7s cubic-bezier(.2,1.2,.4,1) both}
.pod.p1{animation-delay:.5s}.pod.p2{animation-delay:.25s}
.pod .pname{font-family:var(--f-display);font-weight:700;line-height:1.8;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

function mergeProgress(d){
  if(!d) return;

  for(const l of ["th","en"]) S.prog.points[l]=Math.max(num(S.prog.points[l]),num(pts[l]));

}
function cleanPlay(r){
  if(!r||typeof r!=="object"||!/^(th|en)$/.test(r.lang)||!Array.isArray(r.items)) return null;
  return {id:String(r.id||""),at:String(r.at||""),lang:r.lang,i:Math.min(5,num(r.i)),correct:Math.min(10,num(r.correct)),n:Math.min(10,num(r.n))||10,gain:num(r.gain),

async function initShared(){
  if(!window.claude?.use){S.dbNote="local";return}
  try{
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user){S.dbNote="local";return}
    const uid=await user.id(); if(!uid){S.dbNote="local";return}
    S.db=db;S.uid=uid;
    // players saved from other devices
    const all=await db.collection("data/users/"+uid).get().catch(()=>null);
    if(all){const pl=players();all.docs.forEach(d=>{const n=d.data()?.name;if(/^p_[0-9a-f]{8}$/.test(d.id)&&typeof n==="string"&&n)pl[d.id]=normName(n)});store.set("dict.players",pl)}
    S.dbNote="shared";
    if(S.pid) await syncPlayer();
    if(S.view==="name") render(); else if(S.view!=="play") render();
  }catch(e){S.dbNote="local"}
}
async function syncPlayer(){
  if(!S.db||!S.pid) return;
  const pid=S.pid, uid=S.uid, db=S.db;
  const [pd,plays]=await Promise.all([progDoc(pid).get().catch(()=>null),playsCol(pid).orderBy("at","desc").limit(100).get().catch(()=>null)]);
  // one-time: the save from before players existed goes to the player who owned the local legacy save (or the first one synced)
  let legacy=[];
  if(!store.get("dict.legacyDone",false)&&(!store.get("dict.legacyPid","")||store.get("dict.legacyPid","")===pid)){
    const [lp,lplays,old]=await Promise.all([db.collection("data/users/"+uid).doc("progress").get().catch(()=>null),
      db.collection("data/users/"+uid+"/progress/plays").orderBy("at","desc").limit(100).get().catch(()=>null),
      db.collection("scores").doc(uid).get().catch(()=>null)]);
    if(lp?.exists) mergeProgress(lp.data()); if(old?.exists) mergeProgress(old.data());
    if(lplays) legacy=lplays.docs;
    store.set("dict.legacyDone",true);
  }
  if(S.pid!==pid) return;   // player switched while loading
  if(pd?.exists) mergeProgress(pd.data());
  const have=new Set(S.hist.map(h=>h.id));
  [...(plays?plays.docs:[]),...legacy].forEach(d=>{const r=cleanPlay({id:d.id,...(d.data()||{})});if(r&&!have.has(r.id)){S.hist.push(r);have.add(r.id)}});
  S.hist.sort((a,b)=>b.at<a.at?-1:1); S.hist=S.hist.slice(0,100);
  saveLocal(); saveProgress();
}

  if(play) playsCol().doc(play.id).set(play).catch(()=>{});
}

let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()||[]}catch(e){voices=[]}}

const LOCALE={th:"th-TH",en:"en-US"};
// devices ship several voices per language; the robotic ones are usually the compact defaults,
// so rank the natural / enhanced / network voices first
function voiceScore(v,lang){
  const l=(v.lang||"").replace("_","-").toLowerCase(), n=v.name||"";
  let sc=0;
  if(l===LOCALE[lang].toLowerCase()) sc+=4;
  if(/premium|enhanced|natural|neural|siri/i.test(n)) sc+=6;
  if(/google/i.test(n)) sc+=4;
  if(/kanya|narisa|samantha|ava|allison|aria|jenny/i.test(n)) sc+=2;
  if(/compact|eloquence|espeak|grandma|grandpa|bad news|bells|bubbles|whisper|zarvox|trinoids|jester|organ|superstar|cellos/i.test(n)) sc-=10;
  return sc;
}
function voicesFor(lang){const p=LANG[lang].voice;return voices.filter(v=>v.lang&&v.lang.toLowerCase().startsWith(p)).sort((a,b)=>voiceScore(b,lang)-voiceScore(a,lang))}
function voiceFor(lang){const vs=voicesFor(lang);return vs.find(v=>v.voiceURI===VOICE.pref[lang])||vs[0]}
function hasVoice(lang){return REC.ids.size>0 || ("speechSynthesis" in window && !!voiceFor(lang))}
/* Recorded words (audio/<id>.m4a, listed in audio/manifest.json) play first;
   the browser's own voice is the fallback. Recordings come from make-audio.sh. */
const REC={ids:new Set(),el:null};
function wordId(lang,w){let h=0x811c9dc5;for(const ch of lang+":"+w){h^=ch.codePointAt(0);h=Math.imul(h,0x01000193)>>>0}return lang+"_"+h.toString(16).padStart(8,"0")}
fetch("audio/manifest.json",{cache:"no-cache"}).then(r=>r.ok?r.json():null).then(m=>{if(m&&Array.isArray(m.ids))REC.ids=new Set(m.ids.map(String))}).catch(()=>{});
function speak(text,lang,slow){
  const id=wordId(lang,text);
  if(!REC.ids.has(id)) return speakTTS(text,lang,slow);
  try{speechSynthesis.cancel()}catch(e){}
  const a=REC.el||(REC.el=new Audio()); a.pause();
  a.src="audio/"+id+".m4a"; a.preservesPitch=true; a.playbackRate=slow?0.7:1;
  const b=$("#speak"); if(b)b.classList.add("playing"); SFX.duck(true);
  const done=()=>{const b=$("#speak");if(b)b.classList.remove("playing");SFX.duck(false)};
  a.onended=done; a.onerror=()=>{done();speakTTS(text,lang,slow)};
  a.play().then(()=>speechToast(false)).catch(()=>{done();speakTTS(text,lang,slow)});
}
let speakTimer=null;
function speakTTS(text,lang,slow){
  if(!("speechSynthesis" in window))return;
  speechSynthesis.cancel(); clearTimeout(speakTimer);
  try{speechSynthesis.resume()}catch(e){}   // Chrome can leave the queue stuck in "paused"
  // a short gap after cancel() stops Chrome/Safari from clipping or garbling the next word
  speakTimer=setTimeout(()=>{
    const u=new SpeechSynthesisUtterance(text);
    const v=voiceFor(lang); u.lang=v?v.lang:LOCALE[lang]; try{if(v)u.voice=v}catch(e){}
    const r=VOICE.rate[lang]||0.85; u.rate=slow?Math.max(0.4,r*0.65):r; u.pitch=1; u.volume=1;
    const b=$("#speak"); if(b)b.classList.add("playing");
    SFX.duck(true);
    let started=false; u.onstart=()=>{started=true;speechToast(false)};
    u.onend=u.onerror=()=>{const b=$("#speak");if(b)b.classList.remove("playing");SFX.duck(false)};
    speechSynthesis.speak(u);
    // some browsers (Brave with Shields up, missing voices) accept the call and stay silent
    setTimeout(()=>{if(!started){SFX.duck(false);const b=$("#speak");if(b)b.classList.remove("playing");speechToast(true)}},2500);
  },90);
}

/* ============================================================
   GAME SOUNDS — original chiptune-ish cues synthesised with Web Audio
   (no audio files). Quiet by default, music ducks while a word is read.
   ============================================================ */
const SFX=(()=>{
  let ctx=null,master=null,musicBus=null,sfxBus=null,timer=null,kind=null,pat=null,step=0,nextT=0,urgent=false;
  let muted=store.get("dict.mute",false);
  const VOL=0.14, MUSIC=0.45, DUCK=0.12;
  function ac(){
    if(!ctx){
      const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null;
      try{ctx=new AC()}catch(e){return null}
      master=ctx.createGain(); master.gain.value=muted?0:VOL; master.connect(ctx.destination);
      musicBus=ctx.createGain(); musicBus.gain.value=MUSIC; musicBus.connect(master);
      sfxBus=ctx.createGain(); sfxBus.gain.value=1; sfxBus.connect(master);
    }
    if(ctx.state==="suspended") ctx.resume().catch(()=>{});
    return ctx;
  }

    const c=ac(); if(!c||muted) return;
    const osc=c.createOscillator(), g=c.createGain();
    osc.type=o.type||"sine"; osc.frequency.setValueAtTime(f,t);
    if(o.to) osc.frequency.exponentialRampToValueAtTime(o.to,t+dur);
    const v=o.vol??0.6;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+(o.a||0.006)); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    osc.connect(g); g.connect(o.bus||sfxBus); osc.start(t); osc.stop(t+dur+0.02);
  }
  let noiseBuf=null;
  function noise(t,dur,vol=0.3,bus){
    const c=ac(); if(!c||muted) return;
    if(!noiseBuf){noiseBuf=c.createBuffer(1,c.sampleRate*0.5,c.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}

  }
  const c=sbc(); if(!c){setTimeout(()=>onStatus("error"),0);return {send(){},close(){}}}
  const ch=c.channel("live-"+pin,{config:{broadcast:{self:false,ack:false}}});
  ["hello","ans","bye","lobby","q","reveal","end","state","closed"].forEach(ev=>ch.on("broadcast",{event:ev},m=>onMsg(ev,m.payload)));
  let closing=false;
  ch.subscribe(st=>{if(closing)return;if(st==="SUBSCRIBED")onStatus("ok");else if(st==="CHANNEL_ERROR"||st==="TIMED_OUT")onStatus("error")});

    <div class="dots" id="dots">${dots}</div>
    <button class="arrow" id="next-slide" aria-label="ด่านถัดไป">›</button>
  </div>
  <p class="muted" style="text-align:center;font-size:.88rem;margin-top:14px">ปัดหรือแตะการ์ดเพื่อเลือกด่าน · ฟังให้ครบ 10 คำแล้วค่อยตรวจทีเดียว คะแนนสะสมไปเรื่อยๆ เพื่อเปิดด่านใหม่และแบดจ์</p>`;
}

function stageInfo(i){
  const L=LEVELS[S.lang], lv=L[i], open=stageOpen(S.lang,i), best=num(S.prog.best[key(S.lang,i)]), lp=num(S.prog.points[S.lang]);
  return `<div class="fade-in" style="display:grid;justify-items:center;gap:6px;width:100%">
    <span class="eyebrow">ด่าน ${i+1} / ${L.length} · สุ่ม ${ROUND} คำจากคลัง ${lv.items.length} คำ · คำละ ${PTS} คะแนน</span>
    <h2>${esc(lv.title)}</h2>
    <span class="sub">${esc(lv.sub)}</span>
    ${open?`${starHTML(starsFor(best))}<button class="btn primary start" data-start="${i}">${best?"เล่นอีกครั้ง":"เริ่ม"}</button>`
      :`<span class="lockline" style="--keyhole:var(--paper)">${LOCK} สะสมคะแนน${LANG[S.lang].label}อีก ${STAGE_AT[i]-lp} คะแนนเพื่อเปิดด่านนี้</span>
        <div class="bar"><i style="width:${Math.round(lp/STAGE_AT[i]*100)}%"></i></div>`}
  </div>`;
}
// Each stage keeps a shuffled deck of words not yet played; a round deals the next 10,
// so every word in the bank comes up once before any word repeats.
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function drawWords(lang,i){
  const k=key(lang,i), pool=LEVELS[lang][i].items;
  S.prog.deck=S.prog.deck&&typeof S.prog.deck==="object"?S.prog.deck:{};
  let deck=(Array.isArray(S.prog.deck[k])?S.prog.deck[k]:[]).filter(w=>pool.includes(w));
  const picked=[];
  while(picked.length<Math.min(ROUND,pool.length)){
    if(!deck.length) deck=shuffle(pool.filter(w=>!picked.includes(w)));
    const w=deck.shift(); if(!picked.includes(w)) picked.push(w);
  }
  S.prog.deck[k]=deck; saveLocal();
  return picked;
}
function startLevel(i){
  hush();
  const words=drawWords(S.lang,i);
  S.game={lang:S.lang,i,words,pos:0,answers:Array(words.length).fill(""),peeked:Array(words.length).fill(false)};
  S.view="play"; render();
  setTimeout(()=>sayCurrent(false),250);
}
const word=(g,j)=>g.words[j];
function sayCurrent(slow){const g=S.game;speak(word(g,g.pos),g.lang,slow)}
function viewPlay(){
  const g=S.game, lv=LEVELS[g.lang][g.i], n=g.words.length, lastQ=g.pos===n-1;
  const lines=g.answers.map((a,j)=>j===g.pos
    ?`<div class="line cur"><span class="n">${j+1}</span><input id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" lang="${g.lang}" placeholder="เขียนคำที่ได้ยิน…" aria-label="คำตอบข้อ ${j+1}" value="${esc(a)}"></div>`
    :`<div class="line"><span class="n">${j+1}</span>${j<g.pos||a?`<span class="written ${a?"":"blank"}">${a?esc(a):"—"}</span>`:""}</div>`).join("");
  return `
  ${hasVoice(g.lang)?"":`<div class="notice">อุปกรณ์นี้ไม่มีเสียงอ่าน${g.lang==="th"?"ภาษาไทย":"ภาษาอังกฤษ"} ให้กด “แอบดู” แทน หรือให้คนอื่นอ่านให้ฟัง (ข้อที่แอบดูได้ ${PTS/2} คะแนน)</div>`}
  <section class="page" aria-label="แบบฝึกหัด">
    <div class="page-head">
      <div><span class="eyebrow">${LANG[g.lang].label} · ด่าน ${g.i+1}</span><h2>${esc(lv.title)}</h2></div>
      <span class="muted" style="font-variant-numeric:tabular-nums">ข้อ ${g.pos+1}/${n}</span>
    </div>
    <div class="controls" style="border-top:0;border-bottom:2px solid var(--rule)">
      <button class="speak" id="speak" aria-label="ฟังอีกครั้ง">${icon.speaker}</button>
      <button class="btn" id="slow">${icon.slow} ฟังช้า</button>
      <button class="btn" id="peek">${icon.eye} แอบดู</button>
      <span id="peekbox" class="peek" hidden></span>
    </div>
    ${voicePanel(g.lang)}
    <div class="lines">${lines}</div>
    <div class="controls">
      <button class="btn" id="quit">ออก</button>
      <button class="btn" id="back" ${g.pos===0?"disabled":""}>‹ ข้อก่อน</button>
      <span class="spacer"></span>
      <button class="btn primary" id="advance">${lastQ?"ส่งตรวจทั้งหมด":"คำต่อไป"} ↵</button>
    </div>
  </section>`;
}
function keepAnswer(){const g=S.game,inp=$("#answer");if(inp)g.answers[g.pos]=inp.value}
function advance(){
  keepAnswer();
  const g=S.game,n=g.answers.length;
  if(g.pos+1>=n){finishLevel();return}
  g.pos++; render(); $("#answer")?.focus(); setTimeout(()=>sayCurrent(false),200);
}
function goBack(){keepAnswer();const g=S.game;if(g.pos>0){g.pos--;render();$("#answer")?.focus()}}

function finishLevel(){
  hush();
  const g=S.game, n=g.answers.length;
  g.marks=g.answers.map((a,j)=>norm(a,g.lang)!==""&&norm(a,g.lang)===norm(word(g,j),g.lang));
  g.correct=g.marks.filter(Boolean).length;
  g.gain=g.marks.reduce((s,ok,j)=>s+(ok?(g.peeked[j]?PTS/2:PTS):0),0);
  const before=total(S.prog), beforeLang=num(S.prog.points[g.lang]);
  S.prog.points[g.lang]=beforeLang+g.gain;
  const k=key(g.lang,g.i); S.prog.best[k]=Math.max(num(S.prog.best[k]),g.correct);
  const after=total(S.prog);
  g.newBadges=BADGES.filter(b=>before<b.at&&after>=b.at);
  g.newStages=STAGE_AT.map((at,i)=>i).filter(i=>beforeLang<STAGE_AT[i]&&S.prog.points[g.lang]>=STAGE_AT[i]);
  const play={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),at:new Date().toISOString(),lang:g.lang,i:g.i,
    correct:g.correct,n,gain:g.gain,items:g.answers.map((a,j)=>({w:word(g,j),a:a.slice(0,120),ok:g.marks[j]}))};
  S.hist.unshift(play); S.hist=S.hist.slice(0,100);
  saveProgress(play);
  submitRound(g);
  S.view="result"; render(); window.scrollTo({top:0});
}
function answerRows(items){
  return `<div class="answers">${items.map((x,j)=>`<div class="ans">
    <span class="n">${j+1}</span>
    <span class="main"><span class="written ${x.ok?"":x.a?"strike":"blank"}">${x.a?esc(x.a):"—"}</span>${x.ok?"":`<span class="fix">${esc(x.w)}</span>`}</span>
    <span class="mark">${x.ok?"✓":"✗"}</span>
    ${MEAN[x.w]?`<span class="meaning">${esc(MEAN[x.w])}</span>`:""}
  </div>`).join("")}</div>`;
}
function viewResult(){
  const g=S.game, n=g.answers.length, L=LEVELS[g.lang];
  const hasNext=g.i+1<L.length, nextOpen=hasNext&&stageOpen(g.lang,g.i+1);
  return `<section class="page">
    <div class="result">
      <span class="eyebrow">${LANG[g.lang].label} · ด่าน ${g.i+1} · ${esc(L[g.i].title)}</span>
      <div class="circled">${g.correct}/${n}</div>
      ${starHTML(starsFor(g.correct)).replace('class="stars"','class="stars" style="font-size:1.8rem"')}
      <div class="gain">+${g.gain} คะแนน · สะสม ${total(S.prog).toLocaleString()}</div>
      ${g.newStages.length?`<div class="row" style="justify-content:center">${g.newStages.map(i=>`<span class="newstage">เปิดด่าน ${i+1} แล้ว!</span>`).join("")}</div>`:""}
      ${g.newBadges.length?`<h2>ได้แบดจ์ใหม่!</h2><div class="unlocks">${g.newBadges.map(b=>`<figure class="badge-reveal">${badgeArt(b,150,true)}<figcaption>${esc(b.name)}</figcaption></figure>`).join("")}</div>`:""}
    </div>
    <div style="margin-top:8px">${answerRows(g.answers.map((a,j)=>({w:word(g,j),a,ok:g.marks[j]})))}</div>
    <div class="controls" style="justify-content:center">
      <button class="btn" id="retry">เล่นด่านนี้อีกครั้ง</button>
      ${nextOpen?`<button class="btn primary" id="nextlvl">ไปด่าน ${g.i+2}</button>`:""}
      <button class="btn" id="home">กลับหน้าด่าน</button>
    </div>
  </section>`;
}

function viewBadges(){
  const t=total(S.prog), got=earnedBadges(t).length;
  return `<p class="eyebrow">สะสมแล้ว ${got}/${BADGES.length} · ${t.toLocaleString()} คะแนน</p>
  <h2>สมุดสะสมแบดจ์</h2>
  <p class="muted">ถูก 1 คำได้ ${PTS} คะแนน คะแนนทั้งภาษาไทยและอังกฤษรวมกันเพื่อปลดล็อก</p>
  <div class="badges">${BADGES.map(b=>{const e=t>=b.at;
    return `<div class="bcard ${e?"":"locked"}">${e?badgeArt(b,130,true):lockedArt(b,130)}
      <span class="bn">${esc(b.name)}</span>
      <span class="bl">${e?"ปลดล็อกแล้ว":`ปลดล็อกที่ ${b.at.toLocaleString()} คะแนน (อีก ${(b.at-t).toLocaleString()})`}</span></div>`}).join("")}</div>`;
}

function viewHistory(){
  const H=S.hist, rounds=H.length;
  if(!rounds) return `<h2>ประวัติการเล่น</h2><div class="empty" style="margin-top:14px">ยังไม่มีประวัติ เล่นจบสักด่านแล้วผลจะมาอยู่ที่นี่</div>`;
  const words=H.reduce((s,h)=>s+h.n,0), right=H.reduce((s,h)=>s+h.correct,0);
  const miss={}; H.forEach(h=>h.items.forEach(x=>{if(!x.ok)miss[x.w]=(miss[x.w]||0)+1}));
  const top=Object.entries(miss).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const fmt=iso=>{try{return new Date(iso).toLocaleString("th-TH",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}catch(e){return ""}};
  return `<p class="eyebrow">${S.dbNote==="shared"?"บันทึกไว้กับบัญชีของคุณ":"บันทึกไว้ในเครื่องนี้"}</p>
  <h2>ประวัติการเล่น</h2>
  <div class="stats">
    <div class="stat"><b>${rounds}</b><span>รอบที่เล่น</span></div>
    <div class="stat"><b>${Math.round(right/words*100)}%</b><span>ตอบถูก</span></div>
    <div class="stat"><b>${total(S.prog).toLocaleString()}</b><span>คะแนนสะสม</span></div>
  </div>
  ${top.length?`<h3 class="sec">คำที่พลาดบ่อย</h3><div class="missed">${top.map(([w,c])=>`<span title="${esc(MEAN[w]||"")}">${esc(w)}<small>×${c}</small></span>`).join("")}</div>`:""}
  <h3 class="sec">ทุกรอบ</h3>
  <div class="hist">${H.map(h=>{const lv=LEVELS[h.lang][h.i];return `<details>
    <summary><span class="sc">${h.correct}/${h.n}</span>
      <span class="what"><b>${esc(lv?lv.title:"")}</b><span>${LANG[h.lang].label} · ด่าน ${h.i+1} · ${fmt(h.at)}</span></span>
      <span class="pt">+${h.gain}</span></summary>
    ${answerRows(h.items)}
  </details>`}).join("")}</div>`;
}

/* ============================================================
   Carousel
   ============================================================ */
let ringTimer=null;
function setupRing(){
  const ring=$("#ring"), wrap=$("#ring-wrap"); if(!ring) return;
  const cards=[...ring.children], n=cards.length, A=360/n, dots=[...document.querySelectorAll("[data-dot]")];
  const R=Math.round(cards[0].offsetWidth/2/Math.tan(Math.PI/n))+14;
  cards.forEach((c,i)=>c.style.transform=`rotateY(${i*A}deg) translateZ(${R}px)`);
  // S.slide holds an unbounded step count so the ring can keep spinning past the last card
  let rot=S.slide[S.lang];
  if(rot==null){rot=0;LEVELS[S.lang].forEach((_,i)=>{if(stageOpen(S.lang,i))rot=i})}
  const front=()=>((Math.round(rot)%n)+n)%n;
  let shown=-1;
  const apply=(extra=0)=>{
    ring.style.transform=`translateZ(${-R}px) rotateY(${-rot*A+extra}deg)`;
    const f=front(); S.slide[S.lang]=rot;
    cards.forEach((c,i)=>{const d=Math.min((i-f+n)%n,(f-i+n)%n);
      c.classList.toggle("front",d===0);c.classList.toggle("side",d===1);c.classList.toggle("far",d>1)});
    dots.forEach((d,j)=>d.setAttribute("aria-current",String(j===f)));
    if(f!==shown){shown=f;$("#stage-info").innerHTML=stageInfo(f);$("#stage-info [data-start]")?.addEventListener("click",()=>startLevel(f))}
  };
  const go=i=>{let d=((i-front())%n+n)%n;if(d>n/2)d-=n;rot=Math.round(rot)+d;apply()};
  const step=d=>{rot=Math.round(rot)+d;apply()};
  ring.classList.add("instant"); apply(); requestAnimationFrame(()=>requestAnimationFrame(()=>ring.classList.remove("instant")));
  dots.forEach((d,j)=>d.onclick=()=>go(j));
  $("#prev").onclick=()=>step(-1); $("#next-slide").onclick=()=>step(1);
  wrap.onkeydown=e=>{if(e.key==="ArrowRight"){e.preventDefault();step(1)}if(e.key==="ArrowLeft"){e.preventDefault();step(-1)}};
  // drag / swipe to spin
  let sx=null,dx=0,moved=false;const DEG=.35;
  wrap.onpointerdown=e=>{if(e.button!==0)return;sx=e.clientX;dx=0;moved=false};
  wrap.onpointermove=e=>{if(sx==null)return;dx=e.clientX-sx;
    if(!moved&&Math.abs(dx)>8){moved=true;ring.classList.add("dragging");try{wrap.setPointerCapture(e.pointerId)}catch(_){}}
    if(moved)apply(dx*DEG)};
  const end=()=>{if(sx==null)return;sx=null;ring.classList.remove("dragging");
    if(moved){const deg=dx*DEG;let k=Math.round(deg/A);if(!k&&Math.abs(deg)>10)k=Math.sign(deg);rot=Math.round(rot)-k;apply()}};
  wrap.onpointerup=end; wrap.onpointercancel=end;
  wrap.addEventListener("click",e=>{
    if(moved){e.stopPropagation();e.preventDefault();moved=false;return}
    const c=e.target.closest(".card3d"); if(!c)return;
    if(c.classList.contains("front")){const b=$("#stage-info [data-start]");if(b)b.click()} else go(+c.dataset.i);
  },true);
  // turn on its own, like a display stand; any touch pauses it for a while
  if(!matchMedia("(prefers-reduced-motion: reduce)").matches){
    let idleUntil=0; const hold=()=>{idleUntil=Date.now()+6000};
    wrap.addEventListener("pointerdown",hold); wrap.addEventListener("keydown",hold);
    $("#stage-info").addEventListener("pointerdown",hold); $(".ring-ctl").addEventListener("pointerdown",hold);
    ringTimer=setInterval(()=>{if(sx==null&&Date.now()>idleUntil&&document.visibilityState==="visible"&&!wrap.matches(":hover")&&!$("#stage-info").matches(":hover"))step(1)},3200);
  }
}

/* ============================================================
   Events
   ============================================================ */
function bind(){
  document.querySelectorAll("[data-start]").forEach(b=>b.onclick=()=>startLevel(+b.dataset.start));
  document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{S.lang=b.dataset.lang;store.set("dict.lang",S.lang);render()});
  setupRing();
  bindLive();
  document.querySelectorAll("[data-lb]").forEach(b=>b.onclick=()=>{const [k,v]=b.dataset.lb.split(":");LB[k]=v;LB.rows=null;loadRank()});
  $("#lb-refresh")&&($("#lb-refresh").onclick=loadRank);
  const nf=$("#name-form"); if(nf){nf.onsubmit=e=>{e.preventDefault();saveName()};const n=$("#nick");n.focus();n.setSelectionRange(n.value.length,n.value.length)}
  $("#name-cancel")&&($("#name-cancel").onclick=()=>{S.view="home";render()});
  document.querySelectorAll("[data-player]").forEach(b=>b.onclick=()=>saveName(b.dataset.player));
  $("#speak")&&($("#speak").onclick=()=>sayCurrent(false));
  $("#slow")&&($("#slow").onclick=()=>sayCurrent(true));
  $("#peek")&&($("#peek").onclick=()=>{const g=S.game,box=$("#peekbox");g.peeked[g.pos]=true;box.textContent=word(g,g.pos);box.hidden=false;setTimeout(()=>{box.hidden=true},1300);$("#answer")?.focus()});
  $("#advance")&&($("#advance").onclick=advance);
  const vc=$("#voicecfg"); if(vc){
    vc.ontoggle=()=>{S.voiceOpen=vc.open};
    const lang=S.game.lang;
    $("#voice-sel")&&($("#voice-sel").onchange=e=>{VOICE.pref[lang]=e.target.value;store.set("dict.voice",VOICE.pref);sayCurrent(false)});
    $("#rate").oninput=e=>{VOICE.rate[lang]=+e.target.value;$("#rate-val").textContent=(+e.target.value).toFixed(2)+"×"};
    $("#rate").onchange=()=>{store.set("dict.rate",VOICE.rate);sayCurrent(false)};
    $("#voice-test").onclick=()=>sayCurrent(false);
  }
  $("#back")&&($("#back").onclick=goBack);
  $("#answer")&&($("#answer").onkeydown=e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();advance()}});
  $("#quit")&&($("#quit").onclick=()=>{hush();S.view="home";render()});
  $("#retry")&&($("#retry").onclick=()=>{S.lang=S.game.lang;startLevel(S.game.i)});
  $("#nextlvl")&&($("#nextlvl").onclick=()=>{S.lang=S.game.lang;startLevel(S.game.i+1)});
  $("#home")&&($("#home").onclick=()=>{S.view="home";render()});
}
if(ONLINE){$("#nav-rank").hidden=false;$("#nav-live").hidden=false}
if(ONLINE&&/^\d{6}$/.test(QS.get("pin")||"")){S.livePin=QS.get("pin");S.view="live"}
$("#who").onclick=()=>{hush();S.view="name";render()};
function setMenu(open){$("header").classList.toggle("open",open);$("#burger").setAttribute("aria-expanded",String(open));$("#burger").setAttribute("aria-label",open?"ปิดเมนู":"เปิดเมนู")}
// light / dark: follows the device until the player picks one
const SUN=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>`;
const MOON=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>`;
function isDark(){const a=document.documentElement.getAttribute("data-theme");return a?a==="dark":matchMedia("(prefers-color-scheme: dark)").matches}
function applyTheme(){
  const t=store.get("dict.theme",null); if(t) document.documentElement.setAttribute("data-theme",t);
  const d=isDark(), b=$("#theme-btn");
  b.innerHTML=(d?SUN:MOON)+`<span class="tl">${d?"โหมดสว่าง":"โหมดมืด"}</span>`;
  b.setAttribute("aria-label",d?"เปลี่ยนเป็นโหมดสว่าง":"เปลี่ยนเป็นโหมดมืด"); b.title=b.getAttribute("aria-label");
}
$("#theme-btn").onclick=()=>{store.set("dict.theme",isDark()?"light":"dark");applyTheme()};
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyTheme)}catch(e){}
applyTheme();
$("#burger").onclick=()=>setMenu(!$("header").classList.contains("open"));
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{hush();S.view=b.dataset.view;render()});

render();
initShared();
</script>
